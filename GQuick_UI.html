        let currentArchiveChannel = null;
        let currentPageToken = null;
        let isFetchingArchive = false;
        const ARCHIVE_SAFETY_LIMIT = 500; // 500件ごとに確認を出す

        function toggleArchiveMenu() {
            const menu = $('archiveMenu');
            if (!menu) return;
            // 他を閉じる
            const settingsMenu = $('settingsMenu');
            const channelMenu = $('channelMenu');
            if (settingsMenu) settingsMenu.classList.remove('active');
            if (channelMenu) channelMenu.classList.remove('active');

            menu.classList.toggle('active');

            if (menu.classList.contains('active')) {
                updateArchiveChannelList();
            }
        }

        function updateArchiveChannelList() {
            const container = $('archiveChannelListContainer');
            if (!container) return;

            if (!channelConfigs || channelConfigs.length === 0) {
                container.innerHTML = '<div style="padding:12px; color:var(--text-sub);">「チャンネル管理」から設定を追加してください</div>';
                return;
            }

            // チャンネルリストを表示 (アーカイブモード用)
            container.innerHTML = channelConfigs.map(c => `
                <div class="menu-item" onclick="startArchiveFetch('${escapeHtml(c.id)}', '${escapeHtml(c.name).replace(/'/g, "\\'")}')">
                    <span>${escapeHtml(c.name)}</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto; opacity:0.3;">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            `).join('');
        }

        async function startArchiveFetch(id, name) {
            const archiveMenu = $('archiveMenu');
            if (archiveMenu) archiveMenu.classList.remove('active');

            // 前回のタイマーをクリア
            clearArchiveTimers();
            isFetchingArchive = false;
            archiveRetryCount = 0;

            // 状態リセット
            currentArchiveChannel = { id: id, name: name };
            currentPageToken = null;
            window.archiveVideos = []; // 完全にリセット
            currentBaseVideos = []; // 検索対象もリセット
            const searchInput = $('searchInput');
            if (searchInput) searchInput.value = ''; // 検索窓をリセット
            renderList([]); // 一旦クリア

            const updateTime = $('updateTime');
            const listBody = $('listBody');
            if (updateTime) updateTime.innerHTML = `<span style="color:var(--primary);">${escapeHtml(name)}</span> のデータを取得中...`;
            if (listBody) listBody.innerHTML = `
                <div class="loading-overlay">
                    <div class="spinner"></div>
                    <p>${escapeHtml(name)} のデータを取得しています...</p>
                </div>
                `;

            await fetchMoreArchive();
        }

        let archiveRetryCount = 0;
        const ARCHIVE_MAX_RETRY = 3;
        let archiveTimeoutId = null;   // タイムアウト用
        let archiveNextTimerId = null; // 次回取得・リトライ用

        // アーカイブ取得の全タイマーをクリア（別操作に移った時に呼ぶ）
        function clearArchiveTimers() {
            if (archiveTimeoutId) { clearTimeout(archiveTimeoutId); archiveTimeoutId = null; }
            if (archiveNextTimerId) { clearTimeout(archiveNextTimerId); archiveNextTimerId = null; }
        }

        async function fetchMoreArchive() {
            if (isFetchingArchive || !currentArchiveChannel) return;
            isFetchingArchive = true;

            // 再開ボタンがあれば削除
            const safetyBoundary = $('safetyLimitBoundary');
            if (safetyBoundary) safetyBoundary.innerHTML = '';

            // タイムアウト保護（30秒）
            let timedOut = false;
            archiveTimeoutId = setTimeout(() => {
                timedOut = true;
                isFetchingArchive = false;
                archiveRetryCount++;
                if (archiveRetryCount <= ARCHIVE_MAX_RETRY) {
                    const updateTime = $('updateTime');
                    if (updateTime) updateTime.innerHTML = `<span style="color:var(--accent);">タイムアウト - リトライ中 (${archiveRetryCount}/${ARCHIVE_MAX_RETRY})...</span>`;
                    archiveNextTimerId = setTimeout(fetchMoreArchive, 1000 * archiveRetryCount);
                } else {
                    showError("タイムアウト: サーバーからの応答がありません。時間をおいて再度お試しください。");
                    archiveRetryCount = 0;
                }
            }, 30000);

            google.script.run
                .withSuccessHandler(res => {
                    clearTimeout(archiveTimeoutId);
                    archiveTimeoutId = null;
                    if (timedOut) return; // タイムアウト後の遅延応答は無視
                    isFetchingArchive = false;
                    archiveRetryCount = 0; // 成功したらリトライカウントリセット

                    if (res.success) {
                        const newVideos = res.data || [];
                        currentPageToken = res.nextPageToken;

                        // アーカイブ専用リストに追加（重複排除）
                        if (!window.archiveVideos) window.archiveVideos = [];
                        const existingIds = new Set(window.archiveVideos.map(v => v && v.id).filter(Boolean));
                        const uniqueNew = newVideos.filter(v => v && v.id && !existingIds.has(v.id));
                        window.archiveVideos = window.archiveVideos.concat(uniqueNew);
                        currentBaseVideos = window.archiveVideos; // アーカイブ内容を検索対象にする

                        // 仮想スクロールで即座に再描画（数万件あっても一瞬）
                        renderList(window.archiveVideos, undefined, true); // アーカイブ追加読み込み時はスクロール維持

                        const statusText = currentPageToken ? '全件取得中...' : '取得完了';
                        const updateTime = $('updateTime');
                        if (updateTime) updateTime.innerHTML = `<span style="color:var(--primary); font-weight:bold;">${escapeHtml(currentArchiveChannel.name)}</span>: ${window.archiveVideos.length} 件(${statusText})`;

                        // 安全制限チェック
                        if (currentPageToken) {
                            if (window.archiveVideos.length >= ARCHIVE_SAFETY_LIMIT && (window.archiveVideos.length % ARCHIVE_SAFETY_LIMIT === 0)) {
                                // 制限に達した場合はボタンを出して停止
                                const boundary = $('safetyLimitBoundary');
                                if (boundary) {
                                    boundary.innerHTML = `
                                    <div style="text-align:center; padding: 20px 0 40px;" id="safetyLimitBtnContainer">
                                        <p style="color:var(--text-sub); margin-bottom:12px; font-size:14px;">安全のため ${window.archiveVideos.length}件で停止しました</p>
                                        <button onclick="fetchMoreArchive()" style="margin:0 auto; padding:12px 32px; background:var(--surface); border:1px solid var(--primary); color:var(--primary); font-weight:bold;">
                                            さらに ${ARCHIVE_SAFETY_LIMIT}件 取得を続ける
                                        </button>
                                    </div>`;
                                }
                                if (updateTime) updateTime.innerHTML = `<span style="color:var(--accent); font-weight:bold;">安全制限: ${window.archiveVideos.length}件で一時停止中</span>`;
                            } else {
                                // 制限以下なら自動で次へ（ブラウザのフリーズを防止するため300ms待機）
                                archiveNextTimerId = setTimeout(fetchMoreArchive, 300);
                            }
                        }
                    } else {
                        showError("取得エラー: " + (res.error || '不明なエラー'));
                    }
                })
                .withFailureHandler(err => {
                    clearTimeout(archiveTimeoutId);
                    archiveTimeoutId = null;
                    if (timedOut) return;
                    isFetchingArchive = false;
                    archiveRetryCount++;
                    if (archiveRetryCount <= ARCHIVE_MAX_RETRY) {
                        const updateTime = $('updateTime');
                        if (updateTime) updateTime.innerHTML = `<span style="color:var(--accent);">通信エラー - リトライ中 (${archiveRetryCount}/${ARCHIVE_MAX_RETRY})...</span>`;
                        archiveNextTimerId = setTimeout(fetchMoreArchive, 1000 * archiveRetryCount);
                    } else {
                        showError("通信エラー: " + (err.message || '不明なエラー') + "\n時間をおいて再度お試しください。");
                        archiveRetryCount = 0;
                    }
                })
                .fetchChannelVideos(currentArchiveChannel.id, currentArchiveChannel.name, currentPageToken);
        }



        // --- Snapshot Functions (IndexedDB優先、localStorageフォールバック) ---
        async function loadSnapshot() {
            try {
                // 1. IndexedDBから読み込み
                let data = null;
                let configs = null;
                try {
                    data = await idbGet('snapshot_v4');
                    configs = await idbGet('configs_v4');
                } catch (idbErr) {
                    // IndexedDB失敗時はlocalStorageフォールバック
                    console.warn("IndexedDB read failed, falling back to localStorage:", idbErr);
                    const json = localStorage.getItem('gquick_snapshot_v4');
                    if (json) {
                        data = JSON.parse(json);
                        const cJson = localStorage.getItem('gquick_configs_v4');
                        if (cJson) configs = JSON.parse(cJson);
                    }
                }

                if (!Array.isArray(data) || data.length === 0) return false;

                allVideos = data;

                // チャンネル設定の復元
                if (Array.isArray(configs) && configs.length > 0) {
                    channelConfigs = configs;
                    updateChannelMenu(channelConfigs);
                }

                const updateTime = $('updateTime');
                if (updateTime) updateTime.innerHTML = `Scanning... (キャッシュ表示中)`;

                // VIPチャンネルの動画を表示（channelConfigsが空なら全件表示にフォールバック）
                let displayVideos;
                if (channelConfigs && channelConfigs.length > 0 && channelConfigs[0].id) {
                    displayVideos = allVideos.filter(v => v && v.channelId === channelConfigs[0].id);
                }
                if (!displayVideos || displayVideos.length === 0) {
                    displayVideos = allVideos.slice(0, 50);
                }
                currentBaseVideos = displayVideos;
                renderList(displayVideos);
                return true;
            } catch (e) {
                console.error("Snapshot Load Error:", e);
                await clearSnapshotCache();
            }
            return false;
        }

        async function saveSnapshot(data, vipName) {
            try {
                // IndexedDBに保存（容量制限なし）
                await idbPut('snapshot_v4', data);
                if (vipName) {
                    localStorage.setItem('gquick_vip_name_v4', vipName);
                }
                if (channelConfigs && channelConfigs.length > 0) {
                    await idbPut('configs_v4', channelConfigs);
                }
                // 旧localStorageデータがあれば削除（移行完了）
                localStorage.removeItem('gquick_snapshot_v4');
                localStorage.removeItem('gquick_configs_v4');
            } catch (e) {
                console.error("IndexedDB save failed, trying localStorage:", e);
                // フォールバック: localStorageに保存
                try {
                    const json = JSON.stringify(data);
                    if (json.length > 4000000) {
                        console.warn("Snapshot too large for localStorage:", (json.length / 1024 / 1024).toFixed(1) + "MB");
                        const updateTime = $('updateTime');
                        if (updateTime) updateTime.innerHTML = `<span style="color:var(--accent);">データ量が多いため、キャッシュを保存できません（次回起動時は再取得になります）</span>`;
                        return;
                    }
                    localStorage.setItem('gquick_snapshot_v4', json);
                    if (channelConfigs && channelConfigs.length > 0) {
                        localStorage.setItem('gquick_configs_v4', JSON.stringify(channelConfigs));
                    }
                } catch (lsErr) {
                    console.error("localStorage save also failed:", lsErr);
                }
            }
        }
        // --------------------------

        async function loadData() {
            const listBody = $('listBody');
            const updateTime = $('updateTime');
            if (!listBody || !updateTime) return;

            // 1. スナップショットがあれば即座に表示
            const hasSnapshot = await loadSnapshot();

            // スナップショットがない場合のみLoading表示
            if (!hasSnapshot) {
                listBody.innerHTML = `
                <div class="loading-overlay">
                        <div class="spinner"></div>
                        <p>チャンネル情報を取得中...</p>
                    </div>
                `;
            }

            try {
                // Server: シートからチャンネル設定一覧を取得（タイムアウト付き）
                const configRes = await Promise.race([
                    new Promise((resolve, reject) => {
                        google.script.run
                            .withSuccessHandler(resolve)
                            .withFailureHandler(reject)
                            .getChannelConfigs();
                    }),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('サーバー応答タイムアウト（30秒）')), 30000))
                ]);

                if (!configRes || !configRes.success) throw new Error((configRes && configRes.error) || '設定取得に失敗しました');

                const configs = configRes.data;
                if (!Array.isArray(configs)) throw new Error('設定データが不正です');

                // 確実な同期
                channelConfigs = configs;
                updateChannelMenu(configs);

                if (configs.length === 0) {
                    listBody.innerHTML = `
                        <div class="loading-overlay" style="text-align:center;">
                            <p style="font-size:16px; font-weight:bold; margin-bottom:16px;">チャンネルが設定されていません</p>
                            <p style="color:var(--text-sub); font-size:13px; margin-bottom:20px;">右上の ⚙ 設定 →「チャンネル管理」から<br>見たいYouTubeチャンネルを追加してください</p>
                            <button onclick="openChannelManager()" style="padding:12px 28px; background:var(--primary); color:#fff; border:none; border-radius:8px; font-size:14px; font-weight:bold; cursor:pointer;">
                                チャンネルを追加する
                            </button>
                        </div>`;
                    return;
                }

                // UI初期化 (スナップショットがある場合はクリアしない)
                if (!hasSnapshot) {
                    allVideos = [];
                    listBody.innerHTML = '';
                }

                // 最新X日間の日時を計算 (フィルタリング用)
                const currentDays = parseInt(localStorage.getItem('gquick_latest_days') || '3', 10);
                const targetDate = new Date();
                targetDate.setDate(targetDate.getDate() - currentDays);

                // --- ★ VIP + 残り全チャンネルを同時に取得開始 ---
                const firstChannel = configs[0];
                updateTime.innerHTML = `Scanning: ${escapeHtml(firstChannel.name)}...`;

                // 残りのチャンネル準備
                const remainingConfigs = configs.slice(1);

                // 小分けバッチ処理
                const BATCH_SIZE = 20;
                const MAX_CONCURRENCY = 10;
                const batches = [];
                for (let i = 0; i < remainingConfigs.length; i += BATCH_SIZE) {
                    batches.push(remainingConfigs.slice(i, i + BATCH_SIZE));
                }

                let completedBatches = 0;
                let activeWorkers = 0;
                let batchIndex = 0;
                let bgSyncDone = false;

                // VIP取得（Promise）
                const vipPromise = new Promise((resolve) => {
                    google.script.run
                        .withSuccessHandler(res => resolve(res))
                        .withFailureHandler(err => resolve({ success: false, error: err.message }))
                        .fetchVideosBatch([firstChannel]);
                });

                // バックグラウンド同期（VIPと同時に開始）
                const bgPromise = (batches.length > 0) ? new Promise((resolveAll) => {
                    const nextBatch = () => {
                        if (batchIndex >= batches.length) {
                            if (activeWorkers === 0) resolveAll();
                            return;
                        }

                        const currentBatches = batches[batchIndex++];
                        activeWorkers++;

                        google.script.run
                            .withSuccessHandler(res => {
                                activeWorkers--;
                                completedBatches++;

                                if (res.success) {
                                    const newVideos = res.data;
                                    allVideos = allVideos.concat(newVideos);

                                    const uniqueMap = new Map();
                                    allVideos.forEach(v => { if (v && v.id) uniqueMap.set(v.id, v); });
                                    allVideos = Array.from(uniqueMap.values());

                                    const percent = batches.length > 0 ? Math.round((completedBatches / batches.length) * 100) : 100;
                                    updateTime.innerHTML = `同期中... ${percent}% (${completedBatches}/${batches.length})`;
                                }
                                nextBatch();
                            })
                            .withFailureHandler(err => {
                                activeWorkers--;
                                completedBatches++;
                                nextBatch();
                            })
                            .fetchVideosBatch(currentBatches);
                    };

                    for (let i = 0; i < Math.min(MAX_CONCURRENCY, batches.length); i++) {
                        nextBatch();
                    }
                }) : Promise.resolve();

                // VIP結果を先に表示（返ってき次第即表示）
                try {
                    const firstRes = await vipPromise;
                    if (firstRes.success) {
                        const otherVideos = allVideos.filter(v => v && v.channelId !== firstChannel.id);
                        allVideos = firstRes.data.concat(otherVideos);

                        const vipVideos = allVideos.filter(v => v && v.channelId === firstChannel.id);
                        currentBaseVideos = vipVideos;
                        // キャッシュ表示中の場合はスクロール位置を維持（ユーザー操作中のリセット防止）
                        const keepScroll = virtualData.length > 0;
                        renderList(vipVideos, undefined, keepScroll);

                        updateTime.innerHTML = `<span style="color:var(--primary); font-weight:700;">${escapeHtml(firstChannel.name)}</span> の動画を表示中... (背景同期中)`;
                    }
                } catch (e) {
                    console.error("First Channel Load Error:", e);
                }

                // 残りの完了を待つ
                await bgPromise;

                if (remainingConfigs.length === 0) {
                    saveSnapshot(allVideos, firstChannel.name);
                    return;
                }

                // 全同期完了後に1回だけソート
                allVideos.sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt));

                saveSnapshot(allVideos, firstChannel.name);
                const now = new Date();
                const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')} `;
                updateTime.innerHTML = `同期完了(${allVideos.length}件) : ${timeStr} `;

            } catch (err) {
                showError(err.message);
            }
        }

        // --- 複数選択・コピー機能 ---
        let selectedUrls = new Set();

        function toggleVideoSelection(url, element) {
            if (selectedUrls.has(url)) {
                selectedUrls.delete(url);
                element.classList.remove('selected');
            } else {
                selectedUrls.add(url);
                element.classList.add('selected');
            }
            updateBulkCopyButton();
        }

        function updateBulkCopyButton() {
            const group = $('bulkActionGroup');
            if (!group) return;
            const count = selectedUrls.size;

            if (count > 0) {
                group.classList.add('has-selection');
            } else {
                group.classList.remove('has-selection');
            }
        }

        function clearSelection() {
            selectedUrls.clear();
            // DOM上の全 .video-item から selected を消す
            document.querySelectorAll('.video-item.selected').forEach(el => {
                el.classList.remove('selected');
            });
            updateBulkCopyButton();
        }

        function copySelectedUrls() {
            if (selectedUrls.size === 0) return;
            const text = Array.from(selectedUrls).join('\n');
            navigator.clipboard.writeText(text).then(() => {
                const btn = $('bulkCopyBtn');
                if (!btn) return;
                const originalContent = btn.innerHTML;
                btn.innerHTML = 'コピー完了！';
                btn.style.borderColor = '#34d399';
                btn.style.color = '#34d399';

                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.style.borderColor = '';
                    btn.style.color = '';
                }, 1500);
            }).catch(err => {
                console.error('Clipboard copy failed:', err);
            });
        }

        let virtualData = [];
        let currentRenderEmptyMessage = '';
        const ITEM_HEIGHT = 96; // 90px (item) + 6px (margin-bottom)
        let isScrolling = false;
        let scrollListenerRegistered = false;

        // スクロールリスナー（重複登録防止）
        function initScrollListener() {
            if (scrollListenerRegistered) return;
            scrollListenerRegistered = true;
            var scrollContainer = document.querySelector('.app-scroll-wrapper') || window;
            scrollContainer.addEventListener('scroll', () => {
                if (!isScrolling) {
                    window.requestAnimationFrame(() => {
                        updateVirtualScroll();
                        isScrolling = false;
                    });
                    isScrolling = true;
                }
            });
        }
        initScrollListener();

        function renderList(videos, emptyMessage, keepScroll) {
            virtualData = videos || [];
            currentRenderEmptyMessage = emptyMessage || '一致する動画が見つかりませんでした';
            // コンテクスト切り替え時はスクロール位置とキーボードフォーカスをリセット
            if (!keepScroll) {
                const sc = document.querySelector('.app-scroll-wrapper');
                if (sc) sc.scrollTop = 0;
                kbFocusIndex = -1;
            }
            updateVirtualScroll(); // 初期描画
        }

        function updateVirtualScroll() {
            const listBody = $('listBody');
            if (!listBody) return;

            if (virtualData.length === 0) {
                listBody.style.paddingTop = '8px';
                listBody.style.paddingBottom = '60px';
                listBody.innerHTML = `<div class="loading-overlay"><p>${currentRenderEmptyMessage}</p></div>`;
                return;
            }

            const sc = document.querySelector('.app-scroll-wrapper');
            const scrollTop = sc ? sc.scrollTop : window.scrollY;
            const viewportHeight = sc ? sc.clientHeight : window.innerHeight;

            // 画面に見える開始インデックスと終了インデックスの計算（上下に余裕を持たせる）
            let startIndex = Math.floor(scrollTop / ITEM_HEIGHT) - 5;
            if (startIndex < 0) startIndex = 0;

            let endIndex = startIndex + Math.ceil(viewportHeight / ITEM_HEIGHT) + 10;
            if (endIndex > virtualData.length) endIndex = virtualData.length;

            const visibleVideos = virtualData.slice(startIndex, endIndex);

            // スクロールバーの長さを維持するための擬似パディング（デフォルトの 8px, 60px を加算）
            const paddingTop = (startIndex * ITEM_HEIGHT) + 8;
            const paddingBottom = ((virtualData.length - endIndex) * ITEM_HEIGHT) + 60;

            const htmlString = visibleVideos.map((v) => {
                if (!v || !v.title || !v.url) return '';
                const isSelected = selectedUrls.has(v.url);
                return `
                <div onclick="if(_lpFired){_lpFired=false;return;} toggleVideoSelection('${v.url}', this)"
                     oncontextmenu="event.preventDefault(); window.open('${v.url}', '_blank');"
                     ontouchstart="_lpStart('${v.url}');"
                     ontouchmove="_lpCancel();"
                     ontouchend="_lpCancel();"
                     class="video-item ${isSelected ? 'selected' : ''}">
                    <div class="thumbnail-wrapper">
                        <img src="${v.thumbnail || ''}" alt="thumb" loading="lazy">
                    </div>
                    <div class="video-content">
                        <div class="video-title" title="${escapeHtml(v.title)}">${escapeHtml(v.title)}</div>
                        <div class="video-meta">
                            <span class="meta-item views">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.7"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                ${v.viewCount ? v.viewCount.toLocaleString() : '0'}
                            </span>
                            <span class="meta-item date">${formatDate(v.publishedAt)}</span>
                            <span class="meta-item duration">${v.duration || ''}</span>
                            <span class="meta-item channel" title="${escapeHtml(v.channelTitle)}" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(v.channelTitle)}</span>
                            <div class="meta-item url-copy" onclick="event.stopPropagation(); copyUrl('${v.url}', this)" title="動画URLをコピー">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                                <span style="font-weight:700;">URLコピー</span>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            }).join('');

            // パディングと中身のHTMLを一括更新（DOM要素数激減・超軽量化）
            // パディングと中身のHTMLを一括更新（DOM要素数激減・超軽量化）
            listBody.style.paddingTop = paddingTop + 'px';
            listBody.style.paddingBottom = paddingBottom + 'px';
            listBody.innerHTML = htmlString;

            // キーボードフォーカスの復元
            if (kbFocusIndex >= 0) {
                applyKbFocusStyle();
            }
        }

        // --- キーボードナビゲーション ---
        let kbFocusIndex = -1; // virtualData内のインデックス

        function applyKbFocusStyle() {
            // 全フォーカスを一旦クリア
            document.querySelectorAll('.video-item.kb-focus').forEach(el => el.classList.remove('kb-focus'));

            if (kbFocusIndex < 0 || kbFocusIndex >= virtualData.length) return;

            // 現在描画されているアイテムの中から該当要素を探す
            const listBody = $('listBody');
            if (!listBody) return;
            const items = listBody.querySelectorAll('.video-item');
            const sc = document.querySelector('.app-scroll-wrapper');

            // 仮想スクロールのstartIndexを逆算
            const scrollTop = sc ? sc.scrollTop : 0;
            let startIndex = Math.floor(scrollTop / ITEM_HEIGHT) - 5;
            if (startIndex < 0) startIndex = 0;

            const domIndex = kbFocusIndex - startIndex;
            if (domIndex >= 0 && domIndex < items.length) {
                items[domIndex].classList.add('kb-focus');
            }
        }

        function scrollToFocusedItem() {
            const sc = document.querySelector('.app-scroll-wrapper');
            if (!sc || kbFocusIndex < 0) return;
            const itemTop = kbFocusIndex * ITEM_HEIGHT + 8; // 8px = listBody paddingTop初期値
            const itemBottom = itemTop + ITEM_HEIGHT;
            const headerHeight = 60; // ヘッダー高さの概算

            // アイテムが画面上に出ているか
            if (itemTop < sc.scrollTop + headerHeight) {
                sc.scrollTop = itemTop - headerHeight;
            } else if (itemBottom > sc.scrollTop + sc.clientHeight) {
                sc.scrollTop = itemBottom - sc.clientHeight + 10;
            }
        }

        document.addEventListener('keydown', (e) => {
            // 検索欄にフォーカス中は無視（文字入力を優先）
            const searchInput = $('searchInput');
            if (document.activeElement === searchInput) {
                // Escapeで検索欄からフォーカスを外す
                if (e.key === 'Escape') {
                    searchInput.blur();
                    e.preventDefault();
                }
                return;
            }

            // モーダルが開いている場合はEscapeで閉じる
            if (e.key === 'Escape') {
                const channelModal = $('channelModal');
                const manualModal = $('manualModal');
                if (channelModal && channelModal.style.display === 'flex') {
                    closeChannelManager();
                    e.preventDefault();
                    return;
                }
                if (manualModal && manualModal.classList.contains('active')) {
                    closeManual();
                    e.preventDefault();
                    return;
                }
            }

            if (virtualData.length === 0) return;

            switch (e.key) {
                case 'ArrowDown':
                case 'j': // Vim風
                    e.preventDefault();
                    kbFocusIndex = Math.min(kbFocusIndex + 1, virtualData.length - 1);
                    scrollToFocusedItem();
                    updateVirtualScroll();
                    break;

                case 'ArrowUp':
                case 'k': // Vim風
                    e.preventDefault();
                    if (kbFocusIndex <= 0) {
                        kbFocusIndex = 0;
                    } else {
                        kbFocusIndex--;
                    }
                    scrollToFocusedItem();
                    updateVirtualScroll();
                    break;

                case 'Enter':
                    // Enter: 動画を新タブで開く
                    if (kbFocusIndex >= 0 && kbFocusIndex < virtualData.length) {
                        e.preventDefault();
                        const v = virtualData[kbFocusIndex];
                        if (v && v.url) window.open(v.url, '_blank');
                    }
                    break;

                case ' ':
                    // Space: 選択/解除
                    if (kbFocusIndex >= 0 && kbFocusIndex < virtualData.length) {
                        e.preventDefault();
                        const sv = virtualData[kbFocusIndex];
                        if (!sv || !sv.url) break;
                        if (selectedUrls.has(sv.url)) {
                            selectedUrls.delete(sv.url);
                        } else {
                            selectedUrls.add(sv.url);
                        }
                        updateBulkCopyButton();
                        updateVirtualScroll();
                    }
                    break;

                case 'PageDown': {
                    e.preventDefault();
                    const scPd = document.querySelector('.app-scroll-wrapper');
                    const pageSize = scPd ? Math.max(1, Math.floor(scPd.clientHeight / ITEM_HEIGHT) - 1) : 10;
                    if (kbFocusIndex < 0) kbFocusIndex = 0;
                    kbFocusIndex = Math.min(kbFocusIndex + pageSize, virtualData.length - 1);
                    scrollToFocusedItem();
                    updateVirtualScroll();
                    break;
                }

                case 'PageUp': {
                    e.preventDefault();
                    const scPu = document.querySelector('.app-scroll-wrapper');
                    const pageSizeUp = scPu ? Math.max(1, Math.floor(scPu.clientHeight / ITEM_HEIGHT) - 1) : 10;
                    if (kbFocusIndex < 0) kbFocusIndex = 0;
                    kbFocusIndex = Math.max(kbFocusIndex - pageSizeUp, 0);
                    scrollToFocusedItem();
                    updateVirtualScroll();
                    break;
                }

                case 'Home':
                    e.preventDefault();
                    kbFocusIndex = 0;
                    scrollToFocusedItem();
                    updateVirtualScroll();
                    break;

                case 'End':
                    e.preventDefault();
                    kbFocusIndex = virtualData.length - 1;
                    scrollToFocusedItem();
                    updateVirtualScroll();
                    break;

                case '/':
                    // 検索にフォーカス
                    e.preventDefault();
                    if (searchInput) searchInput.focus();
                    break;
            }
        });

        // --- チャンネル管理 (DBモード) ロジック ---
        function openChannelManager() {
            // モーダルを表示
            const modal = $('channelModal');
            if (modal) modal.style.display = 'flex';

            // ★多重ガード: 起動時に必ずボタンをリセット
            const btn = $('saveChannelBtn');
            if (btn) {
                btn.innerHTML = '設定を保存';
                btn.disabled = false;
            }

            renderChannelEditor();
        }

        function closeChannelManager() {
            const modal = $('channelModal');
            if (modal) modal.style.display = 'none';
        }

        function renderChannelEditor() {
            const list = $('channelEditorList');
            if (!list) return;
            if (!channelConfigs || channelConfigs.length === 0) {
                list.innerHTML = '<p style="text-align:center; padding:15px; color:var(--text-sub); font-size:12px;">チャンネルがありません。「チャンネルを追加」から登録してください。</p>';
                return;
            }
            list.innerHTML = channelConfigs.map((ch, i) => `
                <div class="channel-editor-item" style="display:flex; align-items:center; gap:8px; margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid rgba(255,255,255,0.05);">
                    <div style="display:flex; flex-direction:column; gap:4px;">
                        <button class="icon-btn" title="上に移動" onclick="moveChannel(${i}, -1)" ${i === 0 ? 'disabled style="opacity:0.2;"' : ''} style="padding:2px; font-size:10px;">▲</button>
                        <button class="icon-btn" title="下に移動" onclick="moveChannel(${i}, 1)" ${i === channelConfigs.length - 1 ? 'disabled style="opacity:0.2;"' : ''} style="padding:2px; font-size:10px;">▼</button>
                    </div>
                    <div style="flex:1;">
                        <div style="font-size:10px; color:var(--primary); margin-bottom:2px; font-weight:bold;">${escapeHtml(ch.name || 'IDを入力してください')}</div>
                        <input type="text" value="${ch.id}" placeholder="チャンネルID (UC...) または URL" data-index="${i}" onchange="syncInputsToConfigs()" style="width:100%; font-size:12px; padding:6px;">
                    </div>
                    <button class="icon-btn" onclick="removeChannelInput(${i})" style="color:#ef4444; background:transparent; font-size:18px; padding:4px;">&times;</button>
                </div>
            `).join('');
        }

        // --- HTMLエスケープヘルパー ---
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        // --- ★重要: 入力内容を即時反映し、URLを自動パースするロジック ---
        function syncInputsToConfigs() {
            const inputs = document.querySelectorAll('#channelEditorList input');
            inputs.forEach((input, idx) => {
                if (!channelConfigs[idx]) return;
                const rawVal = input.value.trim();
                const cleanId = extractChannelId(rawVal);

                if (channelConfigs[idx].id !== cleanId) {
                    channelConfigs[idx].id = cleanId;
                    channelConfigs[idx].name = '取得中...';
                    channelConfigs[idx].sheetName = '取得中...';

                    const container = input.closest('.channel-editor-item');
                    if (container) {
                        const nameLabel = container.querySelector('div[style*="font-size:10px"]');
                        if (nameLabel) nameLabel.innerText = '保存後に取得...';
                    }
                }
            });
        }

        function extractChannelId(str) {
            if (!str) return '';
            str = str.trim();
            // /channel/UC... 形式のURLからIDを抽出
            const channelMatch = str.match(/\/channel\/(UC[a-zA-Z0-9_-]{22})/);
            if (channelMatch) return channelMatch[1];
            // UC/UU始まりかつ24文字のIDならそのまま
            if (/^U[CU][a-zA-Z0-9_-]{22}$/.test(str)) return str;
            // @handle 形式 (youtube.com/@handle または @handle 単体)
            const handleMatch = str.match(/(?:youtube\.com\/)?@([a-zA-Z0-9_.\-]+)/);
            if (handleMatch) return '@' + handleMatch[1];
            // /c/name または /user/name 形式
            const customMatch = str.match(/youtube\.com\/(?:c|user)\/([^/?&]+)/);
            if (customMatch) return '@' + customMatch[1];
            // それ以外は無効
            return str;
        }

        function validateChannelId(id) {
            if (!id) return false;
            return /^U[CU][a-zA-Z0-9_-]{22}$/.test(id);
        }

        // --- ★重要: 保存ボタンの状態を初期化 ---
        function resetSaveButton() {
            const btn = $('saveChannelBtn');
            if (btn) {
                btn.innerHTML = '設定を保存';
                btn.disabled = false;
            }
        }

        function moveChannel(index, direction) {
            syncInputsToConfigs();
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= channelConfigs.length) return;
            const temp = channelConfigs[index];
            channelConfigs[index] = channelConfigs[newIndex];
            channelConfigs[newIndex] = temp;
            resetSaveButton();
            renderChannelEditor();
        }

        function addChannelInput() {
            syncInputsToConfigs();
            channelConfigs.push({ id: '', name: '取得中...', sheetName: '取得中...' });
            resetSaveButton();
            renderChannelEditor();
        }

        function removeChannelInput(index) {
            syncInputsToConfigs();
            channelConfigs.splice(index, 1);
            resetSaveButton();
            renderChannelEditor();
        }

        function saveChannelsFromUI(btn) {
            syncInputsToConfigs();
            const newConfigs = [];
            const invalidIds = [];
            const handleConfigs = []; // @handle形式の解決待ちリスト

            channelConfigs.forEach(ch => {
                const id = ch.id.trim();
                if (!id) return;
                if (validateChannelId(id)) {
                    newConfigs.push({ id, name: ch.name || '取得中...', sheetName: ch.sheetName || '取得中...' });
                } else if (id.startsWith('@')) {
                    handleConfigs.push({ handle: id, name: ch.name });
                } else {
                    invalidIds.push(id);
                }
            });

            if (invalidIds.length > 0) {
                alert('以下のチャンネルIDが正しくありません。\nUCから始まる24文字のIDを入力してください。\n\n' + invalidIds.join('\n'));
                return;
            }

            if (newConfigs.length === 0 && handleConfigs.length === 0) {
                if (!confirm('チャンネルをすべて削除しますか？')) return;
            }

            btn.innerHTML = '保存中...';
            btn.disabled = true;

            const doSave = (configs) => {
                if (configs.length === 0) {
                    if (!confirm('有効なチャンネルが0件です。全削除しますか？')) { resetSaveButton(); return; }
                }
                google.script.run
                    .withSuccessHandler(async (res) => {
                        if (res.success) {
                            alert('設定を保存しました。');
                            resetSaveButton();
                            closeChannelManager();
                            await clearSnapshotCache();
                            allVideos = [];
                            channelConfigs = [];
                            loadData();
                        } else {
                            alert('保存失敗: ' + res.error);
                            resetSaveButton();
                        }
                    })
                    .withFailureHandler(err => {
                        alert('通信エラー: ' + err.message);
                        resetSaveButton();
                    })
                    .saveChannelConfigs(configs);
            };

            if (handleConfigs.length > 0) {
                btn.innerHTML = 'ハンドル解決中...';
                const handles = handleConfigs.map(h => h.handle);
                google.script.run
                    .withSuccessHandler(resolved => {
                        const unresolved = [];
                        handleConfigs.forEach(hc => {
                            const r = resolved[hc.handle];
                            if (r) {
                                newConfigs.push({ id: r.id, name: r.name, sheetName: r.name });
                            } else {
                                unresolved.push(hc.handle);
                            }
                        });
                        if (unresolved.length > 0) {
                            alert('以下のハンドルが見つかりませんでした。\n' + unresolved.join('\n'));
                        }
                        btn.innerHTML = '保存中...';
                        doSave(newConfigs);
                    })
                    .withFailureHandler(err => {
                        alert('ハンドル解決エラー: ' + err.message);
                        resetSaveButton();
                    })
                    .resolveChannelHandles(handles);
            } else {
                doSave(newConfigs);
            }
        }

        function toggleSettings() {
            const menu = $('settingsMenu');
            if (!menu) return;
            menu.classList.toggle('active');
            const channelMenu = $('channelMenu');
            const archiveMenu = $('archiveMenu');
            if (channelMenu) channelMenu.classList.remove('active');
            if (archiveMenu) archiveMenu.classList.remove('active');
        }

        let _filterTimer = null;
        function filterList() {
            clearTimeout(_filterTimer);
            _filterTimer = setTimeout(() => {
                const input = $('searchInput');
                if (!input) return;
                const query = input.value.toLowerCase();
                const clearBtn = $('searchClearBtn');
                if (clearBtn) clearBtn.style.display = query ? 'flex' : 'none';
                const source = currentBaseVideos.length > 0 ? currentBaseVideos : allVideos;
                const filtered = source.filter(v =>
                    v && v.title && v.title.toLowerCase().includes(query)
                );
                renderList(filtered);
            }, 250);
        }

        function clearSearch() {
            const input = $('searchInput');
            if (!input) return;
            input.value = '';
            filterList();
            input.focus();
        }

        function formatDate(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            if (isNaN(d.getTime())) return '日付不明';
            const now = new Date();
            const diffHrs = Math.floor((now - d) / 3600000);
            if (diffHrs < 24) {
                return `<span class="batch-label">NEW · ${diffHrs}時間前</span>`;
            }
            return `${d.getFullYear()}/${(d.getMonth() + 1).toString().padStart(2, '0')}/${d.getDate().toString().padStart(2, '0')} ${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
        }

        function translateError(msg) {
            if (!msg) return '不明なエラーが発生しました';
            if (msg.includes('quota') || msg.includes('Quota')) return 'YouTube APIの通信制限に達しました。翌日になれば自動的にリセットされます。';
            if (msg.includes('notFound') || msg.includes('not found')) return 'チャンネルまたは動画が見つかりませんでした。チャンネルIDを確認してください。';
            if (msg.includes('forbidden') || msg.includes('Forbidden')) return 'アクセスが拒否されました。チャンネルが非公開の可能性があります。';
            if (msg.includes('timeout') || msg.includes('Timeout') || msg.includes('タイムアウト')) return 'サーバーからの応答がありません。時間をおいて再度お試しください。';
            if (msg.includes('NetworkError') || msg.includes('Failed to fetch')) return 'ネットワーク接続を確認してください。';
            return msg;
        }

        function showError(msg) {
            const listBody = $('listBody');
            if (!listBody) return;
            const userMsg = translateError(msg);
            listBody.innerHTML = `
                <div class="loading-overlay" style="color:#f87171; text-align:center; max-width:80%; margin:0 auto;">
                    <p style="font-weight:bold; margin-bottom:12px;">エラーが発生しました</p>
                    <div style="font-size:13px; margin-bottom:16px;">${escapeHtml(userMsg)}</div>
                    <button onclick="refreshData()" style="padding:10px 24px; background:var(--surface); border:1px solid var(--primary); color:var(--primary); border-radius:6px; font-size:13px; font-weight:bold; cursor:pointer;">再読み込み</button>
                </div>
            `;
        }

        async function copyUrl(url, el) {
            try {
                await navigator.clipboard.writeText(url);
                const originalContent = el.innerHTML;
                el.style.color = 'var(--badge-text)';
                el.style.background = 'var(--badge-bg)';
                el.style.borderColor = 'var(--badge-border)';
                el.innerHTML = '<span style="font-weight:800;">URL Copied!</span>';
                setTimeout(() => {
                    el.style.color = '';
                    el.style.background = '';
                    el.style.borderColor = '';
                    el.innerHTML = originalContent;
                }, 1500);
            } catch (err) {
                console.error('Copy failed', err);
            }
        }

        async function refreshData() {
            const btn = $('refreshBtn');
            if (!btn) return;
            const originalHTML = btn.innerHTML;
            const settingsMenu = $('settingsMenu');
            if (settingsMenu) settingsMenu.classList.remove('active');
            btn.style.pointerEvents = 'none';
            btn.style.opacity = '0.6';
            btn.innerHTML = '🔄 更新中...';
            try {
                await new Promise((resolve, reject) => {
                    google.script.run
                        .withSuccessHandler(res => {
                            if (res.success) resolve();
                            else reject(new Error(res.error));
                        })
                        .withFailureHandler(reject)
                        .clearScriptCache();
                });
                await clearSnapshotCache();
                allVideos = [];
                window.archiveVideos = [];
                channelConfigs = [];
                await loadData();
            } catch (e) {
                console.error("Refresh Error:", e);
            } finally {
                btn.style.pointerEvents = '';
                btn.style.opacity = '';
                btn.innerHTML = originalHTML;
            }
        }


        // --- Manual Modal ---
        function openManual() {
            const manualModal = $('manualModal');
            const settingsMenu = $('settingsMenu');
            if (manualModal) manualModal.classList.add('active');
            if (settingsMenu) settingsMenu.classList.remove('active');
        }

        function closeManual() {
            const manualModal = $('manualModal');
            if (manualModal) manualModal.classList.remove('active');
        }
    </script>
</body>

</html>

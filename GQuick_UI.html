<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <meta charset="UTF-8">
    <title>Q-Quick NEXT</title>

    <!-- モバイルアプリ設定 & アイコン (最優先事項) -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Q-Quick NEXT">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b0f1a">




<!-- フォント: システムフォントスタックを使用 (Google Fonts はGASサンドボックス非対応のため削除) -->
    <style>
        :root {
            /* ダークモード (デフォルト) */
            --bg: #0b0f1a;
            --surface: rgba(30, 41, 59, 0.7); /* 仮想スクロール化により透過・ガラス表現復活 */
            --surface-hover: rgba(51, 65, 85, 0.8);
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --text: #f8fafc;
            --text-sub: #94a3b8;
            --border: rgba(255, 255, 255, 0.08); /* 透過ボーダー復活 */
            --border-highlight: rgba(255, 255, 255, 0.15);
            --accent: #fbbf24;
            /* Amber */
            --shadow: rgba(0, 0, 0, 0.4);
            --header-bg: #0b0f1a;
            --glass-blur: 0px;

            /* バッジ */
            --badge-bg: rgba(52, 211, 153, 0.1);
            --badge-text: #34d399;
            --badge-border: rgba(52, 211, 153, 0.2);
        }

        [data-theme="light"] {
            /* ライトモード - ガラス質感を維持しつつ明るく */
            --bg: #f1f5f9;
            --surface: rgba(255, 255, 255, 0.7); /* ガラス表現復活 */
            --surface-hover: rgba(255, 255, 255, 0.9);
            --primary: #2563eb;
            --primary-glow: rgba(37, 99, 235, 0.3);
            --text: #0f172a;
            --text-sub: #475569;
            --border: rgba(0, 0, 0, 0.15);
            --border-highlight: rgba(0, 0, 0, 0.3);
            --accent: #d97706;
            --shadow: rgba(0, 0, 0, 0.08);
            --header-bg: #f1f5f9;

            --badge-bg: rgba(37, 99, 235, 0.05);
            --badge-text: #1d4ed8;
            --badge-border: rgba(37, 99, 235, 0.1);
        }

        /* スクロールバー - ダークテーマ用 */
        html, *, *::before, *::after {
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
        }
        html::-webkit-scrollbar,
        *::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        html::-webkit-scrollbar-track,
        *::-webkit-scrollbar-track {
            background: transparent;
        }
        html::-webkit-scrollbar-thumb,
        *::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }
        html::-webkit-scrollbar-thumb:hover,
        *::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        html::-webkit-scrollbar-corner,
        *::-webkit-scrollbar-corner {
            background: transparent;
        }

        /* スクロールバー - ライトテーマ用 */
        [data-theme="light"],
        [data-theme="light"] * {
            scrollbar-color: rgba(0, 0, 0, 0.2) transparent;
        }
        [data-theme="light"]::-webkit-scrollbar-thumb,
        [data-theme="light"] *::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
        }
        [data-theme="light"]::-webkit-scrollbar-thumb:hover,
        [data-theme="light"] *::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.35);
        }

        html, body {
            overflow: hidden;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'Noto Sans JP', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .app-scroll-wrapper {
            height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg);
        }

        header {
            padding: 6px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--header-bg);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        /* チャンネル管理ダイアログ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg);
            border: 1px solid var(--border-highlight);
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--accent);
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        .channel-editor-item {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            align-items: center;
        }

        .channel-editor-item input {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text);
            font-size: 13px;
            flex: 1;
        }

        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--text);
        }

        .logo-wrapper {
            display: flex;
            align-items: center;
            padding: 0;
        }

        .logo-wrapper h1 {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            margin: 0;
            color: var(--text);
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            font-style: italic;
            white-space: nowrap;
            /* スマホ縦持ちでも絶対に折り返さない */
            flex-shrink: 0;
            /* 検索ボックスに負けない */
        }

        .q-char {
            color: #ff9800;
            /* オレンジ（Amber） */
            -webkit-text-stroke: 1.2px #000;
            /* 黒の縁取り */
            font-size: 2.0rem;
            line-height: 1;
            margin-right: 6px;
            filter: drop-shadow(0 0 10px rgba(255, 152, 0, 0.4));
            position: relative;
            display: inline-block;
            /* 欠け防止 */
            padding-right: 4px;
            /* 右側の余裕を確保 */
            transform: skewX(-10deg);
            /* 自前の傾斜でスピード感を維持 */
        }

        /* アンダーライン装飾：オレンジに合わせて調整 */
        .q-char::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 5%;
            width: 90%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ff9800, transparent);
            border-radius: 2px;
        }

        .logo-text {
            color: var(--text);
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            opacity: 0.95;
            margin-left: 2px;
            white-space: nowrap;
            /* 念のためここも固定 */
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            position: relative;
        }

        .search-wrapper {
            display: flex;
            align-items: center;
            background: var(--surface);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            /* 超・明示的なボーダー */
            overflow: hidden;
            width: 190px;
            margin-left: 8px;
            transition: all 0.2s;
        }

        .search-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 8px var(--primary-glow);
        }

        #searchInput {
            flex: 1;
            min-width: 0;
            /* ボタンを押し出さないように縮小を許可 */
            padding: 6px 12px;
            border: none;
            background: transparent;
            outline: none;
            color: var(--text);
            font-size: 13px;
        }

        .search-clear-btn {
            background: transparent;
            border: none;
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-sub);
            padding: 0;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            line-height: 1;
            transition: all 0.2s;
            width: 32px !important;
            height: 32px !important;
            min-width: 32px !important;
        }

        .search-clear-btn:hover {
            background: rgba(239, 68, 68, 0.1) !important;
            color: #ef4444 !important;
        }

        #searchInput:focus {
            outline: none;
            box-shadow: none;
        }

        button {
            padding: 6px 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            opacity: 0.8;
        }

        button:disabled {
            background-color: var(--surface-hover);
            color: var(--text-sub);
            cursor: not-allowed;
            opacity: 0.6;
            box-shadow: none;
        }

        .icon-btn {
            padding: 8px;
            background-color: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .icon-btn:hover {
            background-color: var(--surface-hover);
            border-color: var(--border-highlight);
        }

        /* Bulk Action Group */
        /* Bulk Action Group (Always Visible & Refined) */
        .bulk-action-group {
            display: flex;
            align-items: center;
            gap: 0;
            background: var(--surface);
            border-radius: 10px;
            border: 1px solid var(--border);
            overflow: hidden;
            margin-left: 8px;
            opacity: 1;
            /* 常時表示 */
            transform: none;
            pointer-events: auto;
        }

        /* 選択されている時の発光スタイル */
        .bulk-action-group.has-selection {
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        #bulkCopyBtn,
        #bulkClearBtn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 6px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        #bulkCopyBtn {
            padding-right: 10px;
            border-right: 1px solid var(--border);
            color: var(--primary);
            /* 鎖は常に目立たせる */
        }

        #bulkClearBtn {
            font-size: 16px;
            line-height: 1;
            font-weight: bold;
        }

        #bulkCopyBtn:hover {
            background: rgba(37, 99, 235, 0.1);
        }

        #bulkClearBtn:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        #bulkActionGroup.has-selection #bulkCopyBtn {
            color: var(--primary);
        }

        /* Settings Menu */
        .settings-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 6px;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-highlight);
            border-radius: 16px;
            width: 220px;
            transform: translateY(0);
            z-index: 200;
            overflow: hidden;
            display: none;
            box-shadow: 0 10px 25px var(--shadow);
        }

        [data-theme="light"] .settings-menu {
            border: 1.5px solid #000 !important;
            /* ライトモード時は黒でしっかり囲む */
        }

        .settings-menu.active {
            display: block;
        }

        .menu-item {
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .menu-item:hover {
            background: var(--surface-hover);
        }

        .menu-separator {
            height: 1px;
            background: var(--border);
            margin: 4px 0;
        }

        .menu-item.refresh-item {
            color: var(--primary);
            gap: 8px;
            justify-content: flex-start;
        }

        [data-theme="light"] .menu-item:hover {
            background-color: rgba(37, 99, 235, 0.1) !important;
            /* よりはっきりした薄い青 */
        }

        .menu-item svg {
            width: 18px;
            height: 18px;
            color: var(--text-sub);
        }

        /* 期間選択セクション（スライド式） */
        .latest-duration-container {
            display: flex;
            align-items: center;
            gap: 4px;
            overflow: hidden;
            max-width: 0;
            opacity: 0;
        }

        .latest-duration-container.active {
            max-width: 160px;
            /* 4つのチップが入る十分な幅 */
            opacity: 1;
            margin-left: 8px;
            flex-shrink: 0;
        }

        .day-chip {
            flex-shrink: 0;
            /* チップ自体も潰さない */
            padding: 2px 7px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            color: var(--text-sub);
            background: var(--surface-hover);
            border: 1px solid transparent;
        }

        .day-chip:hover {
            opacity: 0.8;
            border-color: var(--primary);
        }

        .day-chip.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 6px var(--primary-glow);
        }

        .duration-toggle-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            border-radius: 50%;
            cursor: pointer;
            color: var(--text-sub);
            margin-right: -4px;
        }

        .duration-toggle-btn:hover {
            background: var(--surface-hover);
            color: var(--primary);
        }

        .duration-toggle-btn.active svg {
            transform: rotate(180deg);
        }

        /* List Styles */
        .list-container {
            flex-grow: 1;
            padding: 8px 16px 60px;
        }

        .video-item {
            height: 90px;
            box-sizing: border-box;
            display: flex;
            gap: 12px;
            padding: 6px 12px;
            background-color: var(--surface);
            backdrop-filter: blur(20px); /* 1万件でも20要素しか描画しないため復活OK */
            -webkit-backdrop-filter: blur(20px);
            border-radius: 6px;
            margin-bottom: 6px;
            border: 1px solid var(--border);
            cursor: pointer;
            position: relative;
            contain: content; /* 最適化: ブラウザのレイアウト計算を要素内に限定し、コンポジット落ちを防ぐ */
            overflow: hidden; /* 仮想スクロール高さハミ出し防止 */
            text-decoration: none;
            color: inherit;
            user-select: none;
            /* テキスト選択を防止してクリック操作を快適に */
        }

        .video-item.selected {
            border: 2px solid var(--primary);
            background-color: var(--surface-hover);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        /* 選択時のチェック表示 */
        .video-item.selected::before {
            content: '✓';
            position: absolute;
            top: 12px;
            left: 12px;
            width: 24px;
            height: 24px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 900;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .video-item.kb-focus {
            background-color: var(--surface-hover);
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.4);
        }

        @media (hover: hover) {
            .video-item:hover {
                background-color: var(--surface-hover);
                border-color: var(--primary);
            }

            [data-theme="light"] .video-item:hover {
                background-color: rgba(37, 99, 235, 0.1) !important;
            }
        }

        .video-item:active {
            opacity: 0.9;
        }

        .thumbnail-wrapper {
            flex-shrink: 0;
            width: 136px;
            height: 76px;
            /* 比率維持 */
            border-radius: 4px;
            overflow: hidden;
            background: #0f172a;
            box-shadow: 0 4px 12px var(--shadow); /* 重厚なシャドウを復活 */
        }

        .thumbnail-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-content {
            flex-grow: 1;
            min-width: 0;
        }

        .video-item:last-child {
            border-bottom: none;
        }

        .video-title {
            font-size: 13.5px;
            font-weight: 700;
            margin-bottom: 2px;
            color: var(--text);
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 11.5px;
            color: var(--text-sub);
            align-items: center;
            font-weight: 400;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .meta-item.views {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .meta-item.channel {
            color: var(--accent);
            font-weight: 700;
        }

        .meta-item.duration {
            background: var(--surface-hover);
            color: var(--text);
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 10.5px;
            font-weight: 800;
        }

        .loading-overlay {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 100px 32px;
            color: var(--text-sub);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(59, 130, 246, 0.1);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            margin-bottom: 24px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .status-bar {
            padding: 12px 32px;
            font-size: 11px;
            color: var(--text-sub);
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            font-weight: 600;
        }

        /* 以前のGクイックのようなバッジ類 */
        .batch-label {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            background: var(--badge-bg);
            color: var(--badge-text);
            border: 1px solid var(--badge-border);
            transition: all 0.3s;
        }

        /* URL Copy Button context-aware styles */
        .url-copy {
            margin-left: auto;
            cursor: pointer;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border-radius: 8px;
            background: var(--surface-hover);
            border: 1px solid var(--border-highlight);
            color: var(--text-sub);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0.85;
            /* ライトモード考慮で高めに設定 */
        }

        [data-theme="light"] .url-copy {
            background: #fff;
            border: 1.5px solid #000;
            /* 黒でしっかり囲む */
            color: #000;
            opacity: 1;
            /* ライトモードでは完全に不透明にして視認性を確保 */
        }

        .url-copy:hover {
            opacity: 1;
            transform: translateY(-1px);
            background: var(--surface-hover);
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .url-copy svg {
            transition: transform 0.2s;
        }

        .url-copy:active svg {
            transform: scale(0.9);
        }

        /* モバイル用微調整 (スマホ縦持ち等) */
        @media screen and (max-width: 480px) {
            header {
                padding: 6px 12px;
                /* 余白を詰める */
            }

            .logo-text {
                font-size: 1.0rem;
                /* ロゴを少しだけ小さくして収める */
            }

            .search-wrapper {
                width: 150px;
                /* ボックスもさらに少しスリムに */
            }
        }
    </style>
</head>

<body tabindex="-1" style="outline:none;">
<div class="app-scroll-wrapper">
    <div class="container">
        <header>
            <div class="header-left">
                <div class="logo-wrapper">
                    <h1>
                        <span class="q-char">Q</span>
                        <span class="logo-text">-クイック</span>
                    </h1>
                </div>
            </div>
            <div class="controls">
                <!-- チャンネルリストボタン -->
                <div style="position: relative;">
                    <button class="icon-btn" onclick="toggleChannelList()" aria-label="Channels"

    <script>
        var allVideos = [];

        var channelConfigs = []; // チャンネル設定を保持

        // --- モバイル長押し（新タブ開く）ヘルパー ---
        var _lpTimer = null;
        var _lpFired = false;
        function _lpStart(url) {
            _lpFired = false;
            _lpTimer = setTimeout(() => {
                _lpFired = true;
                window.open(url, '_blank');
            }, 600);
        }
        function _lpCancel() {
            clearTimeout(_lpTimer);
            _lpTimer = null;
        }

        // --- 安全なDOM取得ヘルパー ---
        function $(id) {
            return document.getElementById(id);
        }

        // --- IndexedDB ラッパー（非同期・大容量キャッシュ） ---
        const IDB_NAME = 'gquick_cache';
        const IDB_STORE = 'snapshots';
        const IDB_VERSION = 1;

        function idbOpen() {
            return new Promise((resolve, reject) => {
                if (!window.indexedDB) { reject(new Error('IndexedDB not supported')); return; }
                const req = indexedDB.open(IDB_NAME, IDB_VERSION);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(IDB_STORE)) {
                        db.createObjectStore(IDB_STORE);
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function idbGet(key) {
            const db = await idbOpen();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(IDB_STORE, 'readonly');
                const store = tx.objectStore(IDB_STORE);
                const req = store.get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
                tx.oncomplete = () => db.close();
            });
        }

        async function idbPut(key, value) {
            const db = await idbOpen();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(IDB_STORE, 'readwrite');
                const store = tx.objectStore(IDB_STORE);
                const req = store.put(value, key);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
                tx.oncomplete = () => db.close();
            });
        }

        async function idbDelete(key) {
            try {
                const db = await idbOpen();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(IDB_STORE, 'readwrite');
                    const store = tx.objectStore(IDB_STORE);
                    const req = store.delete(key);
                    req.onsuccess = () => resolve();
                    req.onerror = () => reject(req.error);
                    tx.oncomplete = () => db.close();
                });
            } catch (e) { /* 無視 */ }
        }

        async function clearSnapshotCache() {
            await idbDelete('snapshot_v4');
            await idbDelete('configs_v4');
            // localStorage側も念のためクリア（旧バージョン移行用）
            localStorage.removeItem('gquick_snapshot_v4');
            localStorage.removeItem('gquick_configs_v4');
        }

        // 初期化：テーマ適用とデータロード
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('gquick_theme') || 'dark';
            setTheme(savedTheme);
            loadData();

            // iframe内にフォーカスを自動取得（キーボード操作をすぐ使えるようにする）
            function grabFocus() {
                window.focus();
                document.body.focus();
            }
            grabFocus();
            setTimeout(grabFocus, 500);
            setTimeout(grabFocus, 1500); // GASバナー表示後にも再取得
            // マウス操作後もフォーカスを維持（検索欄以外）
            document.addEventListener('click', (e) => {
                const tag = e.target.tagName;
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
                document.body.focus();
            });

            // アイコンのチェックマーク（簡易的）
            updateMenuIcons(theme);

        function updateMenuIcons(currentTheme) {
            const darkIcon = $('icon-dark');

            if (!darkIcon || !lightIcon) return;

            // Checkmark SVG path
            const checkmarkPath = `<path d="M20 6L9 17l-5-5"></path>`;
            // Original icons
            const originalDarkIconPath = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
            const originalLightIconPath = `<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`;

            // Reset all
            darkIcon.style.color = 'var(--text-sub)';
            lightIcon.style.color = 'var(--text-sub)';
            darkIcon.innerHTML = originalDarkIconPath;
            lightIcon.innerHTML = originalLightIconPath;

            if (currentTheme === 'dark') {
                darkIcon.style.color = 'var(--primary)';
                darkIcon.innerHTML = checkmarkPath;
            } else {
                lightIcon.style.color = 'var(--primary)';
                lightIcon.innerHTML = checkmarkPath;
            }

            const settingsMenu = $('settingsMenu');

        function updateChannelMenu(configs) {

                    <div class="duration-toggle-btn" onclick="event.stopPropagation(); toggleDurationDrawer(this)" id="durationDrawerBtn">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>

            // ドロワーを閉じる
            const drawer = document.getElementById('latestDurationDrawer');

            showLatest(days);

        /**
         * 最新X日間の動画を表示
         */
        function showLatest(days) {
            // アーカイブ取得中なら停止
            clearArchiveTimers();
            currentArchiveChannel = null;

            const targetDays = (days !== undefined && days !== null) ? days : parseInt(localStorage.getItem('gquick_latest_days') || '3', 10);
            const channelMenu = $('channelMenu');
            if (channelMenu) channelMenu.classList.remove('active');

            let filtered;
            let label;
            if (targetDays === 0) {
                filtered = allVideos.filter(v => v);
                label = '全動画';
            } else {
                const targetDate = new Date();
                targetDate.setDate(targetDate.getDate() - targetDays);
                filtered = allVideos.filter(v => v && new Date(v.publishedAt) >= targetDate);
                label = `最新情報(${targetDays}日間)`;
            }
            currentBaseVideos = filtered;
            const searchInput = $('searchInput');
            if (searchInput) searchInput.value = '';
            renderList(filtered);
            const updateTime = $('updateTime');
            if (updateTime) updateTime.innerHTML = `<span style="color:var(--primary); font-weight:700;">${label}</span>を表示中`;
        }

        function loadChannel(id, name) {
            // アーカイブ取得中なら停止
            clearArchiveTimers();
            currentArchiveChannel = null;

            // メニューを閉じる
            const channelMenu = $('channelMenu');
            if (channelMenu) channelMenu.classList.remove('active');
            const updateTime = $('updateTime');

            // 0秒遷移：手元の全データからフィルタリング
            const searchName = name.trim().toLowerCase();
            const channelVideos = allVideos.filter(v =>
                v && v.channelTitle && v.channelTitle.trim().toLowerCase().includes(searchName)
            );
            currentBaseVideos = channelVideos; // コンテクストを更新
            const searchInput = $('searchInput');
            if (searchInput) searchInput.value = ''; // 検索窓をリセット
            renderList(channelVideos);

            if (updateTime) updateTime.innerHTML = `<span style="color:var(--primary); font-weight:bold;">${escapeHtml(name)}</span>: 最新動画を表示中(0s 遷移)`;
        }
